<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recording</title>
       <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            text-align: center;
        }
        #audio {
            display: none;
            margin-top: 20px;
            font-size: 18px;
            display: inline-block;
            border: none;
            outline: none;
            background-color: transparent;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            display: inline-block;
        }
        #start {
            font-size: 20px;
            padding: 20px 90px;
            margin-right: 10px;
            display: inline-block;
        }
        #stop {
            font-size: 20px;
            padding: 20px 90px;
            display: inline-block;
        }
    </style>

</head>
<body>
    <div id="container">
        <button id="start">Start Recording</button>
        <button id="stop" disabled>Stop Recording</button>
        <audio id="audio" controls></audio>

    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        document.getElementById('start').addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };
                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const audioUrl = URL.createObjectURL(audioBlob);
                            const audioElement = document.getElementById('audio');
                            audioElement.src = audioUrl;
                            console.log("hello");
                            audioElement.style.display = 'inline-block'; // Hiển thị phần tử audio

                            // Tự động tải lên âm thanh
                            uploadAudio(audioBlob);
                        }
                        audioChunks = [];
                    };
                    mediaRecorder.start();
                    document.getElementById('start').disabled = true;
                    document.getElementById('stop').disabled = false;
                })
                .catch(error => {
                    console.error('Lỗi khi truy cập microphone:', error);
<!--                    document.getElementById('result').innerText = 'Lỗi: Không thể truy cập microphone.';-->
                });
        });

        document.getElementById('stop').addEventListener('click', () => {
            if (mediaRecorder) {
                mediaRecorder.stop();
                document.getElementById('start').disabled = false;
                document.getElementById('stop').disabled = true;
            }
        });

        function uploadAudio(audioBlob) {
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.wav');

            fetch('http://127.0.0.1:8000/upload-audio', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Mã lỗi: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                console.log('Thành công:', data);
                // Hiển thị kết quả từ server
<!--                document.getElementById('result').innerText = 'Kết quả: ' + JSON.stringify(data);-->

                // Gửi kết quả đến Dash
                window.parent.postMessage({ result: data.text }, '*');
            })
            .catch((error) => {
                console.error('Lỗi:', error);
<!--                document.getElementById('result').innerText = 'Lỗi: ' + error.message;-->
            });
        }

        // Lắng nghe sự kiện từ Dash để hiện thị kết quả
        window.addEventListener('message', (event) => {
            if (event.data === 'show-result') {
                document.getElementById('result').style.display = 'block';
            }
        });
    </script>
</body>
</html>
